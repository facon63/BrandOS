name: KrokCut — installation Mac

# Vérifie sur de vrais Mac que la commande d'installation fonctionne de bout en bout :
# installation, création de l'app, lancement par double-clic, tests, transcription Whisper.
on:
  workflow_dispatch:
  push:
    paths:
      - "krokcut/**"
      - ".github/workflows/krokcut-mac.yml"

jobs:
  mac:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: Mac Apple Silicon
          - runner: macos-15-intel
            label: Mac Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Installation (la commande donnée aux utilisateurs)
        env:
          KROKCUT_REF: ${{ github.ref_name }}
          KROKCUT_FORCE_FFMPEG_DOWNLOAD: "1" # teste le téléchargement de ffmpeg, même si le Mac l'a déjà
          KROKCUT_NO_OPEN: "1"
        run: bash krokcut/install-mac.sh

      - name: L'app existe et démarre comme au double-clic
        run: |
          test -d ~/Applications/KrokCut.app
          [ ! -d ~/Desktop ] || test -L ~/Desktop/KrokCut
          ~/KrokCut/bin/ffmpeg -hide_banner -encoders | grep -E "libx264|libvpx-vp9"
          open ~/Applications/KrokCut.app
          for i in $(seq 1 120); do curl -fs http://127.0.0.1:8765/api/config && break; sleep 1; done
          curl -fs http://127.0.0.1:8765/ | grep -q KrokCut
          echo "Interface OK"

      - name: Tests (rendu ffmpeg réel)
        run: |
          ~/KrokCut/bin/uv pip install --python ~/KrokCut/.venv/bin/python pytest jsonschema httpx
          cd ~/KrokCut
          PATH="$HOME/KrokCut/bin:$PATH" KROKCUT_FFMPEG_DIR="$HOME/KrokCut/bin" .venv/bin/python -m pytest -q

      - name: Transcription Whisper sur la voix de synthèse du Mac
        run: |
          say -o "$RUNNER_TEMP/voix.aiff" "Hello Mil, this jump was terrible, we need to try again."
          cd ~/KrokCut
          PATH="$HOME/KrokCut/bin:$PATH" .venv/bin/python - <<'EOF'
          import os, subprocess, tempfile
          from pathlib import Path
          from krokcut import audio
          from krokcut.config import WhisperSettings
          from krokcut.transcribe import transcribe_mix
          tmp = Path(tempfile.mkdtemp())
          subprocess.run(["ffmpeg", "-loglevel", "error", "-i", os.environ["RUNNER_TEMP"] + "/voix.aiff",
                          "-ac", "1", "-ar", "16000", "-f", "s16le", str(tmp / "mix.pcm")], check=True)
          curve = audio.level_curve(tmp / "mix.pcm")
          levels = audio.Levels.compute_thresholds(curve, curve - 20)
          words = transcribe_mix(tmp / "mix.pcm", levels, WhisperSettings(model="tiny", language="en"), tmp / "cache")
          text = " ".join(w["w"] for w in words).lower()
          print("Transcription :", text)
          assert "jump" in text or "again" in text, text
          EOF

      - name: Quitter
        if: always()
        run: curl -fs -X POST http://127.0.0.1:8765/api/quit || true
